[package]
name = "aw-kimai-bridge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aw-kimai-bridge"
path = "src/main.rs"

[[bin]]
name = "aw-kimai-admin"
path = "src/bin/admin/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
# default-features = false drops the openssl-sys dependency entirely.
# rustls-tls gives us TLS on all platforms with no system libraries required,
# which is essential for fully-static musl builds on Linux.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
hostname = "0.3"

# libc is used in setup.rs for raw terminal control (hiding password input).
# Only needed on Unix — Windows has its own API for this.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
